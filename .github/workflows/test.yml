name: Tests

# This repo listed pytest as a dev dependency but had no test files and
# no CI workflow running them at all (homelab#720). Runs the unit test
# suite -- no cluster. Some tests spawn real local processes (the
# /execute kill and max-lifetime paths, open-terminal#9), and the
# multi-user ones run commands as a second account via passwordless sudo,
# which GitHub-hosted runners have.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: python3 -m pip install -e . pytest
      - name: Create a second account for the multi-user tests
        run: sudo useradd -m ot-tenant
      - name: Run tests
        timeout-minutes: 10
        env:
          OPEN_TERMINAL_TEST_RUN_AS_USER: ot-tenant
        run: python3 -m pytest tests/ -v
